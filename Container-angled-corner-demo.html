<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Responsive CSS clip-path</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 48px;

      font-family: system-ui, sans-serif;

      background: #f5f2ef;
      color: #222;
    }


    /* ----------------------------------
       Demo layout
       ---------------------------------- */

    .demo {
      display: grid;
      gap: 40px;

      max-width: 1000px;
      margin-inline: auto;
    }


    /* ----------------------------------
       Clipped card
       ---------------------------------- */

    .card {
      --corner-radius: 10px;
      --cut-size: 41.286px;

      padding: 32px;

      background: #c07d5b;

      clip-path: shape(

        /* Start after top-left radius */
        from var(--corner-radius) 0,

        /* Top edge */
        line to calc(100% - var(--cut-size)) 0,

        /* Curve into diagonal */
        curve to calc(100% - 32.818px) 3.498px
          with calc(100% - 35.067px) 1.258px
          / calc(100% - 38.112px) 0,

        /* Diagonal edge */
        line to calc(100% - 3.532px) 32.667px,

        /* Curve into right edge */
        curve to 100% 41.169px
          with calc(100% - 1.271px) 34.919px
          / 100% 37.978px,

        /* Right edge */
        line to 100% calc(100% - var(--corner-radius)),

        /* Bottom-right corner */
        curve to calc(100% - var(--corner-radius)) 100%
          with 100% calc(100% - 4.477px)
          / calc(100% - 4.477px) 100%,

        /* Bottom edge */
        line to var(--corner-radius) 100%,

        /* Bottom-left corner */
        curve to 0 calc(100% - var(--corner-radius))
          with 4.477px 100%
          / 0 calc(100% - 4.477px),

        /* Left edge */
        line to 0 var(--corner-radius),

        /* Top-left corner */
        curve to var(--corner-radius) 0
          with 0 4.477px
          / 4.477px 0,

        close
      );
    }


    /* ----------------------------------
       Card content
       ---------------------------------- */

    .card h2 {
      margin-block: 0 16px;

      font-size: 1.5rem;
    }

    .card p {
      max-width: 55ch;
      margin: 0;

      line-height: 1.5;
    }


    /* ----------------------------------
       Different sizes for testing
       ---------------------------------- */

    .card--original {
      width: min(100%, 497px);
      min-height: 280px;
    }

    .card--wide {
      width: 100%;
      min-height: 220px;
    }

    .card--tall {
      width: min(100%, 400px);
      min-height: 420px;
    }

  </style>
</head>


<body>

  <main class="demo">

    <div class="card card--original">
      <h2>Original proportions</h2>

      <p>
        This card matches the original 497 × 280px SVG.
      </p>
    </div>


    <div class="card card--wide">
      <h2>Wide card</h2>

      <p>
        The width has increased, but the 10px corner radii
        and 41px angled corner remain exactly the same size.
      </p>
    </div>


    <div class="card card--tall">
      <h2>Tall card</h2>

      <p>
        The card can also grow vertically without stretching
        or distorting any of the corner geometry.
      </p>
    </div>

  </main>

</body>
</html>
